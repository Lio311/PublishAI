ר את זרימת המשפטים, משחיז את אוצר המילים ומוחק חזרות מיותרות. במקביל, הוא משתמש בטכניקות מתקדמות להסרת סממנים של בינה מלאכותית ודואג לשמר את קולך הייחודי.\"},\"execution\":{\"title\":\"סוכן ביצוע\",\"desc\":\"כאן הכל קורה בפועל. סוכן הביצוע לוקח את כל ההמלצות והתיקונים מהסוכנים הקודמים ומטמיע אותם בתוך המסמך. כל שינוי מתבצע שקוף לחלוטין ומסומן בפורמט 'עקוב אחר שינויים' כדי שתוכל לעבור סעיף סעיף ולהחליט אילו תיקונים תרצה לאשר או לדחות.\"},\"qa\":{\"title\":\"סוכן בקרת איכות\",\"desc\":\"זוהי הבדיקה הקפדנית האחרונה. הסוכן עובר על המסמך בזכוכית מגדלת ומוודא שאין שגיאות כתיב עדינות, שכל הקישורים עובדים ושההפניות לאיורים מדויקות. הוא דואג להתאמה מלאה ודקדקנית להנחיות ולפורמט של כתב העת המיועד - מהרווחים ועד סגנון הכותרות.\"},\"verification\":{\"title\":\"סוכן אימות\",\"desc\":\"הסוכן מייצר עבורך את כל כלי העזר המשלימים הנדרשים להגשה. הוא כותב מכתב מקדים (Cover Letter) מרשים ומשכנע לעורך כתב העת, ומפיק דו\\\"ח ביקורת עמיתים סימולטיבית המראה כיצד המאמר צפוי להישפט - כך שתגיע שלם ובטוח להגשה.\"},\"compilation\":{\"title\":\"סוכן הידור\",\"desc\":\"בשלב טכני זה, המערכת אוספת את כל השינויים ואורזת אותם חזרה לקובץ נקי ומוכן. המערכת שומרת במדויק על העיצוב המקורי שלך, מבנה העמודים, הכותרות והפונטים, כך שהקובץ הסופי ייראה בדיוק כמו הקובץ שהעלית, רק מלוטש ומושלם.\"},\"export\":{\"title\":\"ייצוא ופרסום\",\"desc\":\"המסע הושלם בהצלחה! כעת תוכל להוריד את חבילת הפרסום המלאה: המאמר המלוטש, קובץ עם מעקב אחר שינויים, המכתב המקדים ודו\\\"ח האימות. הכל זמין להורדה מרוכזת בלחיצת כפתור, מסודר ומוכן לקחת את המחקר שלך לשלב הבא.\"}}},\"submission\":{\"security\":{\"title\":\"תדרוך אבטחה לחיבור למערכת העיתון\",\"whyCredentials\":\"למה אנחנו צריכים את פרטי ההתחברות שלך?\",\"whyCredentialsDesc\":\"כדי להגיש את המאמר אוטומטית, המערכת שלנו צריכה לבצע אימות מול פלטפורמת העיתון (כמו WordPress או OJS) בשמך.\",\"howProtected\":\"איך הנתונים שלך מוגנים?\",\"encryption\":\"פרטי ההתחברות מוצפנים בהצפנת AES-256-GCM מחמירה לפני השמירה.\",\"neverPlaintext\":\"אנחנו לעולם לא שומרים סיסמאות כטקסט גלוי.\",\"del
